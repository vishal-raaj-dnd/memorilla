# Ablation 1 (Slot-Orthogonality): FactKG from scratch with retrieval_init and diversity penalty.
datasets: [factkg]
output_dir: runs/ablation1_factkg
system_prompt: >-
  You are a fact-verification assistant. You receive a claim and a compressed memory of relevant
  knowledge-graph triples about the entities in the claim. Decide whether the claim is supported by the
  evidence. Output exactly 'True' or 'False' with no other text.
retrieval_init: true
max_length: 2048
learning_rate: 1.0e-4
warmup_ratio: 0.1
slot_ortho_weight: 0.05
slot_ortho_margin: 0.0
max_epochs: 5
batch_size: 2
gradient_accumulation_steps: 8
val_check_interval: 0.5
devices: 1
strategy: auto
